name: Public Content Scan

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  scan:
    name: Scan public content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          pathspec=(
            '*.md'
            '*.yml'
            '*.yaml'
            '*.json'
            '*.toml'
            '*.txt'
            ':!.github/workflows/security-scan.yml'
          )

          scan_pattern() {
            local label="$1"
            local pattern="$2"
            local matches
            matches=$(git grep -l -I -E "$pattern" -- "${pathspec[@]}" || true)
            if [ -n "$matches" ]; then
              echo "::error title=$label::Detected in tracked files"
              printf '%s\n' "$matches"
              failed=1
            fi
          }

          scan_pattern "Local filesystem path" '(/home/[^/]+/|/Users/[^/]+/|C:\\Users\\|/tmp/|/var/tmp/)'
          scan_pattern "Private network address" '(192[.]168[.][0-9]+[.][0-9]+|10[.][0-9]+[.][0-9]+[.][0-9]+|172[.](1[6-9]|2[0-9]|3[0-1])[.][0-9]+[.][0-9]+)'
          scan_pattern "Token-like value" '(sk-[[:alnum:]]{32,}|ghp_[[:alnum:]]{36}|ghs_[[:alnum:]]{36}|github_pat_[[:alnum:]_]{22,}|xox[baprs]-[[:alnum:]-]+|AKIA[[:upper:]0-9]{16})'
          scan_pattern "Credential assignment" '([Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd]|[Ss][Ee][Cc][Rr][Ee][Tt])[[:space:]]*[=:][[:space:]]*["'\''"][^"'\'']+["'\'']'

          while IFS= read -r -d '' path; do
            name="${path##*/}"
            case "$name" in
              .env|.env.*|*.pem|*.key|*.p12|*.pfx|*.jks|id_rsa*|id_ed25519*|credentials|credentials.*|secrets|secrets.*)
                echo "::error title=Sensitive filename::$path"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)

          if [ "$failed" -ne 0 ]; then
            echo "Public content scan failed."
            exit 1
          fi

          echo "Public content scan passed."
