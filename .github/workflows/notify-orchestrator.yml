name: Notify Orchestrator

on:
  push:
    branches:
      - main
      - master
    # Public docs and linked assets can live anywhere in this repository.
    # The orchestrator determines which files are included in the mirror.

  workflow_dispatch:

jobs:
  notify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Orchestrator
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ORCHESTRATOR_TOKEN }}
          repository: asopitech-labs/sponsors-orchestrator
          event-type: source-updated
          client-payload: |
            {
              "source": "hc-graphrag/docs",
              "source_type": "public-docs",
              "project": "graphrag",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}",
              "timestamp": "${{ github.event.head_commit.timestamp }}"
            }
